# External Secrets Operator template — actual secrets fetched from Vault at deploy time
# Do NOT commit real secret values here
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pipeline-secrets
  namespace: finetuning-pipeline
spec:
  refreshInterval: "5m"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: pipeline-secrets
    creationPolicy: Owner
  data:
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: secret/pipeline/openai
        property: api_key
    - secretKey: WANDB_API_KEY
      remoteRef:
        key: secret/pipeline/wandb
        property: api_key
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/pipeline/database
        property: url
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/pipeline/redis
        property: url
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: secret/pipeline/kafka
        property: bootstrap_servers
    - secretKey: MODAL_TOKEN_ID
      remoteRef:
        key: secret/pipeline/modal
        property: token_id
    - secretKey: MODAL_TOKEN_SECRET
      remoteRef:
        key: secret/pipeline/modal
        property: token_secret
    - secretKey: VAULT_TOKEN
      remoteRef:
        key: secret/pipeline/vault
        property: token
