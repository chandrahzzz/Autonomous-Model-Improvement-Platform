apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pipeline-api-ingress
  namespace: finetuning-pipeline
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pipeline.your-domain.com
      secretName: pipeline-tls
  rules:
    - host: pipeline.your-domain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pipeline-api
                port:
                  number: 80
