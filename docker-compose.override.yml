# Local dev overrides — not committed to production.
# (Redpanda replaced Kafka+Zookeeper; the base compose already advertises
# PLAINTEXT://localhost:9092, so no broker override is needed here.)

services:
  postgres:
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password

  redis:
    ports:
      - "6379:6379"
