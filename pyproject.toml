[project]
name = "continuous-finetuning-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Core orchestration
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langsmith>=0.1.0",

    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",

    # Cache
    "redis[hiredis]>=5.0.0",

    # Kafka
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",

    # ML / Training
    "peft>=0.11.0",
    "trl>=0.9.0",
    "bitsandbytes>=0.43.0",
    "transformers>=4.41.0",
    "datasets>=2.19.0",
    "accelerate>=0.30.0",
    "modal>=0.62.0",

    # Teacher ($0 stack — Groq free tier)
    "groq>=0.9.0",

    # Evaluation (RAGAS metrics are computed locally; the ragas package is no
    # longer imported — huggingface_hub is for free adapter storage)
    "huggingface-hub>=0.23.0",
    "wandb>=0.17.0",

    # Detection
    "sentence-transformers>=3.0.0",
    "scipy>=1.13.0",
    "scikit-learn>=1.5.0",
    "hdbscan>=0.8.38",

    # Curation
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer>=2.2.354",
    "datasketch>=1.6.4",
    "rouge-score>=0.1.2",

    # Monitoring
    "prometheus-client>=0.20.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-instrumentation-fastapi>=0.45b0",

    # Utilities
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.2.0",
    "hvac>=2.1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "testcontainers[postgres,kafka,redis]>=4.5.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "unsloth[colab-new]>=2024.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-report=html"
markers = [
    "realdb: requires a live PostgreSQL (docker compose up -d postgres). Auto-skips when unreachable.",
]
